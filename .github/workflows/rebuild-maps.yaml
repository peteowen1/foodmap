name: rebuild-maps

# Weekly map refresh. Runs each city's analysis script, commits any
# changed docs/*.html (the GitHub-Pages-hosted Leaflet maps) as a PR
# the maintainer reviews + merges. Also manually triggerable.
#
# The geocode + HTTP caches are gitignored but valuable - the geocode
# cache in particular carries Google-quality coordinates from historical
# runs that we don't want to re-fetch via OSM on every CI run. We
# round-trip them through actions/cache so successive runs reuse them.

on:
  schedule:
    # Sunday 02:00 UTC = Sunday 13:00 AEST (winter) / 12:00 AEDT (summer)
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # Allow up to 90 min - chromote + per-batch Michelin + OSM rate-limit
    # gives Sydney/Melbourne ~5 min each, US cities up to 10 min on a
    # cold cache. 11 cities * worst-case = ~75 min ceiling.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # chromote drives a headless Chromium for Good Food Guide + Broadsheet
      # fallback. The browser-actions/setup-chrome action handles install.
      - name: Install Chrome (chromote dep)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::callr
            any::chromote
            any::htmltools
            any::htmlwidgets
            any::leaflet
            any::withr

      # Restore previous run's geocode + HTTP caches. The cache/ directory
      # has the HTML cache (lots of small files) and the geocode CSV
      # (accumulated, hard-won coordinates).
      #
      # The key is a manual version stamp, NOT a hash of this file: a
      # coordinate doesn't become stale because we bumped an action version
      # or edited the city loop, and losing the geocode cache forces a slow,
      # lower-yield Nominatim re-geocode that can drop cities below their
      # assert_venue_count() floor. Bump v1 -> v2 only to deliberately
      # invalidate the cache.
      #
      # Restore and save are separate steps on purpose. The combined
      # actions/cache step only saves in its post step when the whole job
      # succeeded (post-if: success()), and the job fails whenever any city
      # fails, so a partly-failed run would throw away every geocode it
      # gathered. The explicit save step below runs regardless.
      - name: Restore caches
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: foodmap-caches-v1-${{ github.run_id }}
          restore-keys: |
            foodmap-caches-v1-

      - name: Run all city pipelines
        id: cities
        # chromote locates Chrome via CHROMOTE_CHROME. setup-chrome@v2 moved
        # the install path, so wire the action's output explicitly rather
        # than rely on PATH auto-detection.
        # scrape_all_sources() appends every failed, empty or fallback
        # source to FOODMAP_SOURCE_REPORT; the PR body step reads it back.
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          FOODMAP_SOURCE_REPORT: ${{ runner.temp }}/source_report.md
        run: |
          set -e
          : > "$FOODMAP_SOURCE_REPORT"
          # continue-on-failure per city - a single broken source shouldn't
          # nuke the whole refresh. assert_venue_count() will abort the
          # specific city script that drops below its floor; we capture
          # the abort, move on, and fail the job at the end (after the PR
          # step) so a partly-failed refresh is never a green run.
          failed=""
          for city in sydney melbourne honolulu san_francisco new_york los_angeles london brisbane adelaide perth hobart; do
            echo "::group::city ${city}"
            if ! Rscript -e "devtools::load_all(quiet = TRUE); source(\"analysis/${city}_all_sources.R\")"; then
              echo "::warning::City pipeline failed: ${city}"
              failed="${failed} ${city}"
            fi
            echo "::endgroup::"
          done
          failed="${failed# }"
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      # Save straight after the city loop, even when a city failed, so the
      # geocodes from successful lookups carry forward. Skipped if the city
      # step never ran (an earlier setup step failed), so a missing or
      # stale cache/ is never saved as the newest entry. The key is unique
      # per run, and the restore-keys prefix above picks the newest entry.
      - name: Save caches
        if: ${{ !cancelled() && steps.cities.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: cache
          key: foodmap-caches-v1-${{ github.run_id }}

      - name: Detect doc changes
        id: changes
        run: |
          if git diff --quiet --exit-code -- docs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --stat -- docs/
          fi

      - name: Build PR body
        if: steps.changes.outputs.changed == 'true'
        env:
          FAILED_CITIES: ${{ steps.cities.outputs.failed }}
          FOODMAP_SOURCE_REPORT: ${{ runner.temp }}/source_report.md
        run: |
          {
            echo "Automated weekly map refresh. Each city's analysis script ran"
            echo "against current upstream data; the regenerated docs/*.html"
            echo "files differ from main."
            echo
            echo "Review the diff for any unexpected venue-count drops (the"
            echo '`assert_venue_count()` floor in `inst/extdata/expected_counts.csv`'
            echo "guards against the most severe regressions but small"
            echo "drops aren't blocked)."
            echo
            echo "### Failed cities"
            if [ -n "$FAILED_CITIES" ]; then
              echo "These city pipelines failed, so their maps were not refreshed: ${FAILED_CITIES}"
            else
              echo "None."
            fi
            echo
            echo "### Degraded sources (failed, empty, or fell back to a committed snapshot)"
            if [ -s "$FOODMAP_SOURCE_REPORT" ]; then
              cat "$FOODMAP_SOURCE_REPORT"
            else
              echo "None."
            fi
            echo
            echo "Merge to publish to GitHub Pages."
          } > "${RUNNER_TEMP}/pr_body.md"

      - name: Open PR if maps changed
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/weekly-refresh
          base: main
          commit-message: |
            chore(maps): weekly auto-refresh

            Auto-regenerated by .github/workflows/rebuild-maps.yaml
          title: "chore(maps): weekly auto-refresh"
          body-path: ${{ runner.temp }}/pr_body.md
          add-paths: docs/
          delete-branch: true

      # Runs after the PR step so the cities that did succeed still ship.
      - name: Fail if any city pipeline failed
        if: steps.cities.outputs.failed != ''
        env:
          FAILED_CITIES: ${{ steps.cities.outputs.failed }}
        run: |
          echo "::error::City pipelines failed: ${FAILED_CITIES}"
          exit 1
